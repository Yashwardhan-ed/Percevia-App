name: percevia
description: "Percevia Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  camera: ^0.11.2
  path_provider: ^2.1.3
  path: ^1.9.0
  http: ^1.2.1
  speech_to_text: 7.0.0
  image: ^4.5.4
  camera_android_camerax: 0.6.21+1
  google_mlkit_face_detection: ^0.13.1
  flutter_vision: ^2.0.0
  tflite_flutter: ^0.12.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.2
  google_mlkit_text_recognition: ^0.15.1
  sensors_plus: ^7.0.0
  flutter_gemma: 0.15.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  camera_android_camerax: ^0.7.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo.png
    - assets/mobile.png
    - assets/glasses.png
    - assets/models/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon_src.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/launcher_foreground.png"
  min_sdk_android: 21

# Build sqlite3 (a transitive dep of flutter_gemma) from the vendored
# amalgamation instead of downloading a prebuilt binary from GitHub at build
# time. This keeps `flutter run`/`flutter build` fully offline-capable.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite3/sqlite3.c
